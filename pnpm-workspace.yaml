packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  maplibre-gl: false
  unrs-resolver: true
  vue-demi: false

# @nuxtjs/supabase importa "h3" sem declarar a dependência e acabava pegando o h3 v2 içado.
# Nuxt 4 / Nitro 2 usam h3 v1 ("event.req.headers.get is not a function").
packageExtensions:
  '@nuxtjs/supabase':
    dependencies:
      h3: ^1.15.11
